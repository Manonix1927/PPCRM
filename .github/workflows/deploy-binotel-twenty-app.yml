# Registers / updates the Binotel Twenty App on your production instance.
# Railway redeploy only restarts the server; it does not upload app tarballs.
# This workflow runs `yarn twenty deploy` against TWENTY_APP_DEPLOY_* secrets.
#
# Required repository secrets:
#   TWENTY_APP_DEPLOY_API_URL  — e.g. https://twenty-production-4c84.up.railway.app
#   TWENTY_APP_DEPLOY_API_KEY  — API key from Twenty → Settings → Developers → API keys
#
# After the first successful run you still install the app into each workspace from
# Settings → Applications (unless you add a separate job using install-twenty-app).

name: Deploy Binotel Twenty app

# Runs on every push to main so merges / core changes still redeploy the app.
# (Path-only triggers are easy to miss — e.g. upstream merge touches only twenty-server.)
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-binotel-twenty-app
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deploy secrets
        env:
          API_URL: ${{ secrets.TWENTY_APP_DEPLOY_API_URL }}
          API_KEY: ${{ secrets.TWENTY_APP_DEPLOY_API_KEY }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Repository secret TWENTY_APP_DEPLOY_API_URL is empty or not set (Settings → Secrets → Actions)."
            exit 1
          fi
          if [ -z "$API_KEY" ]; then
            echo "::error::Repository secret TWENTY_APP_DEPLOY_API_KEY is empty or not set (Settings → Secrets → Actions)."
            exit 1
          fi

      - name: Deploy app to Twenty
        uses: ./.github/actions/deploy-twenty-app
        with:
          api-url: ${{ secrets.TWENTY_APP_DEPLOY_API_URL }}
          api-key: ${{ secrets.TWENTY_APP_DEPLOY_API_KEY }}
          app-path: packages/twenty-apps/community/binotel-integration
