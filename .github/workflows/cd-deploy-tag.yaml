name: CD deploy tag

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy-tag:
    # This workflow deploys via twentyhq/twenty-infra and requires org secrets.
    # In forks, the token is not available, so skip to avoid noisy failures.
    if: ${{ github.repository_owner == 'twentyhq' }}
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.TWENTY_INFRA_TOKEN }}
          repository: twentyhq/twenty-infra
          event-type: auto-deploy-tag
          client-payload: '{"github": ${{ toJson(github) }}}' # Passes the entire github context to the downstream workflow
