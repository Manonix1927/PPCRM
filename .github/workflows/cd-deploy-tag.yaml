name: CD deploy tag

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy-tag:
    # This workflow deploys via twentyhq/twenty-infra and requires org secrets.
    # In forks, the token is not available, so skip to avoid noisy failures.
    if: ${{ github.repository_owner == 'twentyhq' }}
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - name: Repository Dispatch
        env:
          GH_TOKEN: ${{ secrets.TWENTY_INFRA_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh api repos/twentyhq/twenty-infra/dispatches \
            -f event_type=auto-deploy-tag \
            -f "client_payload[github][ref_name]=$REF_NAME"
